spring.application.name=Intelligent_Restaurant_Reservation
spring.jpa.show-sql=true
spring.profiles.active=local
# Ae tao file application-local.properties
# Roi copy cau hinh tu file nay qua do nha
# File do la moi truong rieng cua moi nguoi
# Se ko conflict cau hinh DB hay cac thong tin rieng tu khac
# Neu sau nay ae co them 1 cau hinh nao do moi thi hay them no vao file application.properties
# Xong comment dong do lai roi ghi chu cho cac thanh vien khac biet cach su dung

spring.jpa.hibernate.ddl-auto=update
server.port=8080

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/ij_restaurant?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.data.mongodb.uri=mongodb://${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/ij-restaurant-mongodb

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout: 5000
spring.mail.properties.mail.smtp.timeout: 10000
spring.mail.properties.mail.smtp.writetimeout: 10000
spring.thymeleaf.cache=true

app.mail.from=${MAIL_USERNAME:}
app.mail.from-name=Castorant
app.mail.base-url=${MAIL_URL:http://localhost:3000}
app.mail.relay-delay-ms=2000
# max-attempts: so yeu cau toi da trong 1 cua so
# window-seconds: thoi gian cua cua so tinh bang giay
# otp 3rq/15p/email va 10rq/15/ip
app.mail.rate-limit.otp.email.max-attempts=3
app.mail.rate-limit.otp.email.window-seconds: 900

app.mail.rate-limit.otp.ip.max-attempts: 10
app.mail.rate-limit.otp.ip.window-seconds: 900

# reset pass: 5 rq/1h/email
app.mail.rate-limit.password-reset.email.max-attempts: 5
app.mail.rate-limit.password-reset.email.window-seconds: 3600


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy


